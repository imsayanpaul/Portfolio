<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Arial, sans-serif"><rect width="640" height="320" fill="#fff"/><g stroke="#fff" stroke-width="2"><path d="M160 20 L196 72 L124 72 Z" fill="#7c3aed"/><path d="M124 72 L196 72 L232 124 L88 124 Z" fill="#2563eb"/><path d="M88 124 L232 124 L268 176 L52 176 Z" fill="#0891b2"/><path d="M52 176 L268 176 L304 228 L16 228 Z" fill="#16a34a"/><path d="M16 228 L304 228 L320 280 L0 280 Z" fill="#ca8a04"/></g><g fill="#fff" font-weight="bold" font-size="16" text-anchor="middle"><text x="160" y="62">5</text><text x="160" y="106">4</text><text x="160" y="158">3</text><text x="160" y="210">2</text><text x="160" y="262">1</text></g><g font-size="14" fill="#111"><text x="340" y="52" font-weight="bold">5. Self-actualisation</text><text x="340" y="68" fill="#555" font-size="12">achieving full potential</text><text x="340" y="100" font-weight="bold">4. Esteem / Ego</text><text x="340" y="116" fill="#555" font-size="12">status, recognition, prestige</text><text x="340" y="152" font-weight="bold">3. Social / Belongingness</text><text x="340" y="168" fill="#555" font-size="12">love, friendship, acceptance</text><text x="340" y="204" font-weight="bold">2. Safety / Security</text><text x="340" y="220" fill="#555" font-size="12">protection, stability, health</text><text x="340" y="256" font-weight="bold">1. Physiological</text><text x="340" y="272" fill="#555" font-size="12">food, water, shelter, sleep</text></g><text x="320" y="308" font-size="12" text-anchor="middle" fill="#333">Lower needs must be largely met before higher needs motivate behaviour</text></svg>